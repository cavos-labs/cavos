name: Sync JWKS

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-jwks
  cancel-in-progress: false

jobs:
  sync-mainnet:
    name: Sync mainnet JWKS keys
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call JWKS sync endpoint
        env:
          SYNC_JWKS_URL: ${{ secrets.SYNC_JWKS_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          status=$(curl -LsS --max-time 540 -o response.json -w "%{http_code}" \
            -X POST "$SYNC_JWKS_URL" \
            -H "x-admin-key: $ADMIN_API_KEY")
          cat response.json
          test "$status" -ge 200 -a "$status" -lt 300

  sync-slot:
    name: Sync Slot JWKS keys
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cavos-web/package-lock.json

      - name: Install cavos-web dependencies
        working-directory: cavos-web
        run: npm ci

      - name: Refresh slot JWKS on Katana
        run: node .github/scripts/update_slot_jwks.js

      - name: Upload slot JWKS summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slot-jwks-update-summary
          path: slot-jwks-update-summary.json
          if-no-files-found: warn
